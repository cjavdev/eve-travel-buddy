<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bucket-list map</title>
  </head>
  <body>
    <header class="bar">
      <h1>Bucket-list map</h1>
      <div id="legend" class="legend" aria-label="Filter by who's going"></div>
    </header>
    <main class="layout">
      <div id="map" class="map"></div>
      <aside id="panel" class="panel">
        <p class="hint">Pick a pin to see the best upcoming window and who it's for.</p>
      </aside>
    </main>
    <footer id="status" class="status"></footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
